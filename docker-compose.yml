services:
  tvbf-backend:
    build:
      context: .
      target: dev
    # The whole repo, so `uv add` / `uv lock` write pyproject.toml and uv.lock back
    # to the host, and scripts/, tests/ and htmlcov/ are live in the container.
    volumes:
      - .:/app
      # Hide any host .venv (an IDE's, built for macOS) from the container; deps
      # live in the image's /usr/local (UV_PROJECT_ENVIRONMENT).
      - /app/.venv
    # Every key in .env (gitignored; copy .env.example) reaches the container, so
    # a setting added to config.py needs no edit here. Optional, so a fresh clone
    # still boots on the defaults below.
    env_file:
      - path: .env
        required: false
    # What local dev needs that config.py does not default to. `environment`
    # wins over `env_file`, so each takes `${VAR:-default}` to stay overridable
    # from .env.
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://root:root@tbc_postgresql_db:5432/tvbf}"
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-postgresql+asyncpg://root:root@tbc_postgresql_db:5432/tvbf_test}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-dev-secret-change-me}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://app.tvbf.localhost}"
      COOKIE_DOMAIN: "${COOKIE_DOMAIN:-.tvbf.localhost}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.tvbf-backend.rule=Host(`api.tvbf.localhost`)"
      - "traefik.http.routers.tvbf-backend.tls=true"
      - "traefik.http.routers.tvbf-backend.entrypoints=websecure"
      - "traefik.http.services.tvbf-backend.loadbalancer.server.port=8000"
    command: ["uvicorn", "tvbf.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=2).status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - proxy

  # The SPA, from frontend/ (NEU-2235). The browser calls the API directly at
  # VITE_API_BASE_URL, so nothing here reaches the backend container. No published
  # port: Traefik is the only route in.
  tvbf-frontend:
    build:
      context: frontend
      target: dev
    volumes:
      - ./frontend:/app
      # The container's own node_modules (Linux binaries), not the host's.
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-https://api.tvbf.localhost}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.tvbf-frontend.rule=Host(`app.tvbf.localhost`)"
      - "traefik.http.routers.tvbf-frontend.tls=true"
      - "traefik.http.routers.tvbf-frontend.entrypoints=websecure"
      - "traefik.http.services.tvbf-frontend.loadbalancer.server.port=5173"
    # The SPA has no health route; Vite answering `/` is the readiness signal.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - proxy

volumes:
  frontend_node_modules:

networks:
  proxy:
    external: true
