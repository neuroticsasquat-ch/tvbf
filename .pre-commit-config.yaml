minimum_pre_commit_version: "3.5.0"

# Every hook calls a Taskfile target, and the target runs inside a dev container
# (~/projects/tbc-localdev-infra/CONVENTIONS.md): the backend hooks in tvbf-backend,
# the fe-* ones in tvbf-frontend. The Taskfile is the only place the toolchain is
# invoked, so the hooks and `task <x>` can't drift apart. The containers must be up
# (`task up`) and rebuilt after a dependency change (`task build`).
#
# Hooks check and never fix: run `task format` (or `task fe:format`) before committing.
#
# Exceptions:
# - The test hook runs `task test:unit`, not the whole suite. The integration suite
#   needs the test databases and is too slow for every commit; CI runs all of it.
# - fe-format checks only the staged files, because the frontend's main has known
#   prettier drift that this hook must not force a whole-tree reformat over. CI
#   doesn't run prettier at all.
repos:
  - repo: local
    hooks:
      - id: lint
        name: ruff check (backend container)
        entry: task lint
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        exclude: ^frontend/

      - id: format
        name: ruff format --check (backend container)
        entry: task format:check
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        exclude: ^frontend/

      - id: typecheck
        name: pyright (backend container)
        entry: task typecheck
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        exclude: ^frontend/

      - id: test
        name: pytest unit (backend container)
        entry: task test:unit
        language: system
        pass_filenames: false
        files: \.py$|^pyproject\.toml$|^uv\.lock$
        exclude: ^frontend/

      - id: fe-lint
        name: oxlint (frontend container)
        entry: task fe:lint
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css)$

      - id: fe-format
        name: prettier --check (frontend container)
        entry: task fe:format:check --
        language: system
        pass_filenames: true
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css)$

      - id: fe-typecheck
        name: tsc --noEmit (frontend container)
        entry: task fe:typecheck
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css)$

      - id: fe-test
        name: vitest (frontend container)
        entry: task fe:test
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx|js|mjs|json|css)$
